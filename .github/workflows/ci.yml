name: CI

# Lint + tests + unsigned smoke bundle on every push/PR. Tagged releases
# are handled by release.yml — skip this on tags to avoid wasted CI minutes.

on:
  push:
    branches: [main]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or PR supersedes the run in progress;
# finishing the old one only spends macOS minutes (billed at 10x).
# release.yml has no equivalent: a cancelled release could stop between
# notarizing and publishing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, test, smoke build
    runs-on: macos-26  # tests built for macOS 26 only run on 26
    # macOS minutes bill at 10x. Runs take 1.3-2.1 min (July-Aug 2026), so
    # 10 min is ~5x the slowest: room for a cold Homebrew cache, not for a hang.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-sane-${{ runner.os }}

      - name: Install SANE (vendored into the bundle)
        timeout-minutes: 5  # network-bound; 5-9 s with a warm cache
        run: brew install sane-backends

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Smoke bundle (ad-hoc signed)
        env:
          CODESIGN_IDENTITY: "-"
        run: ./bundle.sh

      - name: Verify vendored SANE relocation
        run: |
          scripts/vendor-sane.sh --verify
          test -x PaperDrop.app/Contents/Helpers/scanimage
